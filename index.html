<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi & Dashboard Kehadiran</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --primary:#f38c5b;
  --white:#ffffff;
  --bg:#f6f6f6;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
}
.container{
  max-width:480px;
  margin:auto;
  padding:16px;
}
.menu{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
.menu button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
}
.card{
  background:var(--white);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}
h2{
  margin-top:0;
  color:var(--primary);
  text-align:center;
}
label{
  font-weight:bold;
  display:block;
  margin-top:12px;
}
input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
}
.btn{
  margin-top:18px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
}
.list div{
  padding:10px;
  border-bottom:1px solid #eee;
  font-size:14px;
}
footer{
  text-align:center;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <button onclick="showSection('absen')">Input Absen</button>
    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('list')">Daftar Hadir</button>
  </div>

  <!-- INPUT ABSEN -->
  <div class="card" id="absen">
    <h2>Input Absensi</h2>

    <label>Nama</label>
    <input type="text" id="nama">

    <label>Unit</label>
    <select id="unit">
      <option value="">-- Pilih Unit --</option>
      <option>Rekam Medis</option>
      <option>Radiologi</option>
      <option>Laboratorium</option>
      <option>Farmasi</option>
      <option>Gizi</option>
    </select>

    <button class="btn" onclick="simpanAbsensi()">Simpan Kehadiran</button>
  </div>

  <!-- DASHBOARD -->
  <div class="card" id="dashboard" style="display:none">
    <h2>Dashboard Kehadiran</h2>
    <canvas id="chartKehadiran"></canvas>
  </div>

  <!-- DAFTAR HADIR -->
  <div class="card" id="list" style="display:none">
    <h2>Daftar Hadir</h2>
    <div id="daftarHadir"></div>
  </div>

  <footer>© Absensi Penunjang Medis</footer>

</div>

<script>
// ================= FIREBASE =================
firebase.initializeApp({
  databaseURL:"https://dhasboard-dan-absen-penunjang-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = firebase.database();

// ================= MENU =================
function showSection(id){
  ["absen","dashboard","list"].forEach(s=>{
    document.getElementById(s).style.display="none";
  });
  document.getElementById(id).style.display="block";

  if(id==="dashboard" && chart){
    chart.resize();
  }
}

// ================= SIMPAN ABSENSI =================
function simpanAbsensi(){
  const nama = document.getElementById("nama").value.trim();
  const unit = document.getElementById("unit").value;

  if(!nama || !unit){
    alert("Nama dan Unit wajib diisi");
    return;
  }

  db.ref("absensi").push({
    nama:nama,
    unit:unit,
    waktu:new Date().toLocaleString("id-ID")
  });

  document.getElementById("nama").value="";
  document.getElementById("unit").value="";
  alert("Absensi berhasil disimpan");
}

// ================= DASHBOARD =================
const unitData={
  "Rekam Medis":0,
  "Radiologi":0,
  "Laboratorium":0,
  "Farmasi":0,
  "Gizi":0
};

const ctx=document.getElementById("chartKehadiran").getContext("2d");
const chart=new Chart(ctx,{
  type:"bar",
  data:{
    labels:Object.keys(unitData),
    datasets:[{
      data:Object.values(unitData),
      backgroundColor:"#f38c5b"
    }]
  },
  options:{
    responsive:true,
    plugins:{legend:{display:false}},
    scales:{y:{beginAtZero:true}}
  }
});

// ================= REALTIME LISTENER =================
db.ref("absensi").on("value",snap=>{
  Object.keys(unitData).forEach(k=>unitData[k]=0);
  const list=document.getElementById("daftarHadir");
  list.innerHTML="";

  snap.forEach(c=>{
    const d=c.val();
    if(unitData[d.unit]!==undefined){
      unitData[d.unit]++;
    }
    list.innerHTML+=`
      <div>
        <b>${d.nama}</b><br>
        ${d.unit} • ${d.waktu}
      </div>`;
  });

  chart.data.datasets[0].data=Object.values(unitData);
  chart.update();
});
</script>

</body>
</html>
