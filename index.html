<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi & Dashboard Kehadiran</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root {
  --primary: #f38c5b;
  --white: #ffffff;
  --bg: #f6f6f6;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 16px;
}

.card {
  background: var(--white);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
  color: var(--primary);
  text-align: center;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 12px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  background: var(--primary);
  color: white;
  border: none;
  margin-top: 18px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- FORM ABSENSI -->
  <div class="card">
    <h2>Absensi Kehadiran</h2>

    <label>Nama</label>
    <input type="text" id="nama" placeholder="Masukkan Nama" required>

    <label>Unit</label>
    <select id="unit">
      <option value="">-- Pilih Unit --</option>
      <option value="Rekam Medis">Rekam Medis</option>
      <option value="Radiologi">Radiologi</option>
      <option value="Laboratorium">Laboratorium</option>
      <option value="Farmasi">Farmasi</option>
      <option value="Gizi">Gizi</option>
    </select>

    <button onclick="simpanAbsensi()">Simpan Kehadiran</button>
  </div>

  <!-- DASHBOARD -->
  <div class="card">
    <h2>Dashboard Kehadiran</h2>
    <canvas id="chartKehadiran"></canvas>
  </div>

  <footer>
    © Dashboard Absensi Penunjang Medis
  </footer>

</div>

<script>
// ================= FIREBASE CONFIG =================
// GANTI CONFIG DI BAWAH SESUAI PROJECT ANDA
const firebaseConfig = {
  databaseURL: "https://dhasboard-dan-absen-penunjang-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= SIMPAN ABSENSI =================
function simpanAbsensi() {
  const nama = document.getElementById("nama").value;
  const unit = document.getElementById("unit").value;

  if (!nama || !unit) {
    alert("Nama dan Unit wajib diisi!");
    return;
  }

  db.ref("absensi").push({
    nama: nama,
    unit: unit,
    waktu: new Date().toISOString()
  });

  document.getElementById("nama").value = "";
  document.getElementById("unit").value = "";

  alert("Absensi berhasil disimpan");
}

// ================= DASHBOARD REALTIME =================
const ctx = document.getElementById("chartKehadiran").getContext("2d");

const dataUnit = {
  "Rekam Medis": 0,
  "Radiologi": 0,
  "Laboratorium": 0,
  "Farmasi": 0,
  "Gizi": 0
};

const chart = new Chart(ctx, {
  type: "bar",
  data: {
    labels: Object.keys(dataUnit),
    datasets: [{
      label: "Jumlah Kehadiran",
      data: Object.values(dataUnit),
      backgroundColor: "#f38c5b"
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: { display: false }
    },
    scales: {
      y: { beginAtZero: true }
    }
  }
});

db.ref("absensi").on("value", snapshot => {
  Object.keys(dataUnit).forEach(key => dataUnit[key] = 0);

  snapshot.forEach(child => {
    const unit = child.val().unit;
    if (dataUnit[unit] !== undefined) {
      dataUnit[unit]++;
    }
  });

  chart.data.datasets[0].data = Object.values(dataUnit);
  chart.update();
});
</script>

</body>
</html>
